services:
  - type: web
    name: local-chat-ai
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: UPSTREAM
        value: https://api.openai.com/v1
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: API_KEY
        sync: false
      - key: SYSTEM_PROMPT
        value: You are a helpful, direct technical assistant. Answer clearly and completely.
